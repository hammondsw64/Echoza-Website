<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echoza | Artist Upload Portal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Echoza Artist Upload Portal</h1>
      <p>Upload your music and preview your latest tracks instantly.</p>
    </header>

    <section class="card">
      <h2>Upload a Song</h2>
      <form id="uploadForm">
        <label for="songFile">Choose audio file</label>
        <input id="songFile" name="song" type="file" accept="audio/*" required>

        <button type="submit">Upload Song</button>
      </form>
      <p id="status" aria-live="polite"></p>
    </section>

    <section class="card">
      <h2>Uploaded Songs</h2>
      <ul id="songList" class="song-list"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
